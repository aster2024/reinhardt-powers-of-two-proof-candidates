name: Full n64 exhaustive scan

on:
  workflow_dispatch:

jobs:
  n64-full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y g++
      - run: make verify-all
